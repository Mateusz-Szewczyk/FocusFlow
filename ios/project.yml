# XcodeGen spec — run `xcodegen` in this directory to produce FocusFlow.xcodeproj.
#
# The project file is generated rather than committed so the target graph,
# entitlements and extension wiring stay reviewable as text. Regenerating is
# always safe; never hand-edit the .xcodeproj.
#
# Before the first generate, set TEAM_ID below to your Apple Developer Team ID.

name: FocusFlow

options:
  bundleIdPrefix: com.focusflow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # ---- set this to your real Team ID before generating ----
    DEVELOPMENT_TEAM: TEAM_ID
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete

# The App Group is how the app, the monitor extension and the shield extension
# see the same session. All three must carry it or the shield renders no task
# name and the unlock never fires.
#
# NOTE: App Group IDs are globally unique across the App Store. If
# `group.com.focusflow.shared` is taken, change it here and in
# Shared/SessionStore.swift together.

targets:

  FocusFlow:
    type: application
    platform: iOS
    sources:
      - path: FocusFlow
      - path: Shared
    dependencies:
      - target: FocusFlowMonitor
      - target: FocusFlowShield
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusflow.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Night is the default theme; do not let the system invert it.
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    info:
      path: FocusFlow/Info.plist
      properties:
        CFBundleDisplayName: FocusFlow
    entitlements:
      path: FocusFlow/FocusFlow.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.focusflow.shared

  # Wakes on the schedule and lifts the shield. This target -- not the app --
  # is what makes the unlock survive a force-quit.
  FocusFlowMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: FocusFlowMonitor
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusflow.app.monitor
    info:
      path: FocusFlowMonitor/Info.plist
      properties:
        CFBundleDisplayName: FocusFlow Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
    entitlements:
      path: FocusFlowMonitor/FocusFlowMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.focusflow.shared

  # Draws the block screen. Fixed system template: icon, title, subtitle,
  # up to two buttons -- see docs/tech-stack.md, constraint 2.
  FocusFlowShield:
    type: app-extension
    platform: iOS
    sources:
      - path: FocusFlowShield
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusflow.app.shield
    info:
      path: FocusFlowShield/Info.plist
      properties:
        CFBundleDisplayName: FocusFlow Shield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: FocusFlowShield/FocusFlowShield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.focusflow.shared
