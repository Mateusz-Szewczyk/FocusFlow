<!-- @dsCard group="Colors" viewport="700x170" name="Accent, leaf, amber" subtitle="One accent per screen · foliage only · care only" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink-1);font-family:var(--font-body);padding:20px 24px}
  .mono{font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
  
</style>
</head>
<body>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:16px"><div style="display:flex;flex-direction:column;gap:8px">
    <div style="height:52px;border-radius:8px;background:var(--accent-base);"></div>
    <div class="mono" style="color:var(--ink-2)">--accent-base · accent</div>
    <div class="mono">#8C9BE8</div>
  </div><div style="display:flex;flex-direction:column;gap:8px">
    <div style="height:52px;border-radius:8px;background:var(--leaf);"></div>
    <div class="mono" style="color:var(--ink-2)">--leaf · foliage</div>
    <div class="mono">#8FD0BE</div>
  </div><div style="display:flex;flex-direction:column;gap:8px">
    <div style="height:52px;border-radius:8px;background:var(--amber);"></div>
    <div class="mono" style="color:var(--ink-2)">--amber · care</div>
    <div class="mono">#E0B36A</div>
  </div></div><p class="mono" style="margin:16px 0 0;letter-spacing:.14em">The accent appears once per screen. Leaf never appears outside a tree. Amber is never decoration.</p>
</body>
</html>
