<!-- @dsCard group="Colors" viewport="700x180" name="Night" subtitle="[data-theme='dark'] — session, block and evening screens" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink-1);font-family:var(--font-body);padding:20px 24px}
  .mono{font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
  
</style>
</head>
<body>
<div data-theme="dark" style="background:var(--paper);padding:20px;border-radius:12px">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:16px"><div style="display:flex;flex-direction:column;gap:8px">
    <div style="height:52px;border-radius:8px;background:var(--paper);border:1px solid var(--hairline)"></div>
    <div class="mono" style="color:var(--ink-2)">--paper</div>
    <div class="mono">#111615</div>
  </div><div style="display:flex;flex-direction:column;gap:8px">
    <div style="height:52px;border-radius:8px;background:var(--hairline);border:1px solid var(--hairline)"></div>
    <div class="mono" style="color:var(--ink-2)">--hairline</div>
    <div class="mono">#232B29</div>
  </div><div style="display:flex;flex-direction:column;gap:8px">
    <div style="height:52px;border-radius:8px;background:var(--jade);"></div>
    <div class="mono" style="color:var(--ink-2)">--jade</div>
    <div class="mono">#86B49E</div>
  </div><div style="display:flex;flex-direction:column;gap:8px">
    <div style="height:52px;border-radius:8px;background:var(--leaf);"></div>
    <div class="mono" style="color:var(--ink-2)">--leaf</div>
    <div class="mono">#5E8272</div>
  </div><div style="display:flex;flex-direction:column;gap:8px">
    <div style="height:52px;border-radius:8px;background:var(--amber);"></div>
    <div class="mono" style="color:var(--ink-2)">--amber</div>
    <div class="mono">#C08F4E</div>
  </div></div>
  </div>
</body>
</html>
