<!-- @dsCard group="Brand" viewport="700x180" name="Motion" subtitle="Weather, not feedback" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink-1);font-family:var(--font-body);padding:20px 24px}
  .mono{font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
  
</style>
</head>
<body>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px 26px;font-size:13px;line-height:1.6;color:var(--ink-2)">
    <div><b style="color:var(--ink-1);font-weight:500">Sway</b> — 3–7s, 2–5.5°, every tree offset</div>
    <div><b style="color:var(--ink-1);font-weight:500">Growth</b> — trunk 0.95s, each fork ~30% quicker</div>
    <div><b style="color:var(--ink-1);font-weight:500">Breath</b> — 15s sine on the session ring</div>
    <div><b style="color:var(--ink-1);font-weight:500">Arrive</b> — screens fade up 10px over 0.9s</div>
  </div>
  <p class="mono" style="margin:18px 0 0;letter-spacing:.14em">Nothing pops, bounces or celebrates. Everything respects reduced-motion.</p>
</body>
</html>
