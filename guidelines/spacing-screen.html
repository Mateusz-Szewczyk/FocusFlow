<!-- @dsCard group="Spacing" viewport="700x230" name="Screen rhythm" subtitle="30px gutter · 30px either side of a rule" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink-1);font-family:var(--font-body);padding:20px 24px}
  .mono{font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
  
</style>
</head>
<body>
<div style="border:1px solid var(--hairline);border-radius:12px;overflow:hidden;max-width:390px;position:relative">
    <div style="position:absolute;inset:0 auto 0 0;width:30px;background:var(--hairline);opacity:.35"></div>
    <div style="position:absolute;inset:0 0 0 auto;width:30px;background:var(--hairline);opacity:.35"></div>
    <div style="padding:24px 30px">
      <div class="mono">Next · 18:00</div>
      <div style="font-family:var(--font-display);font-size:24px;margin-top:12px">Review chapter 3</div>
      <hr style="height:1px;background:var(--hairline);border:0;margin:30px 0">
      <p style="font-size:13px;line-height:1.8;color:var(--ink-2);margin:0">50 minutes, ending 18:50.</p>
    </div>
  </div>
</body>
</html>
