<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink-1);font-family:var(--font-body);padding:20px 24px}
  .mono{font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
  
</style>
</head>
<body>
<div style="display:flex;align-items:baseline;gap:30px;flex-wrap:wrap">
    <div style="font-family:var(--font-display);font-size:30px;letter-spacing:-.015em">FocusFlow</div>
    <div style="font-family:var(--font-mono);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-3)">FocusFlow · iOS</div>
    <div style="font-family:var(--font-mono);font-size:7.5px;letter-spacing:.24em;color:var(--ink-3)">FOCUSFLOW</div>
  </div>
  <p class="mono" style="margin:18px 0 0;letter-spacing:.14em">One word, capital F and capital F. Never a leaf glyph, never an icon lockup.</p>
</body>
</html>
