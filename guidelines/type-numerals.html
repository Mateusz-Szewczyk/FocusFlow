<!-- @dsCard group="Type" viewport="700x200" name="Numerals" subtitle="Tabular mono — one big number per screen, at most" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink-1);font-family:var(--font-body);padding:20px 24px}
  .mono{font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
  
</style>
</head>
<body>
<div style="display:flex;align-items:baseline;gap:34px;font-family:var(--font-mono);font-variant-numeric:tabular-nums">
    <div style="font-size:60px;letter-spacing:-.02em">18:50</div>
    <div style="font-size:33px">37:48</div>
    <div style="font-size:15px">in 12 min</div>
  </div>
  <p class="mono" style="margin:18px 0 0;letter-spacing:.14em">Times are 24-hour. A time is never set in the serif.</p>
</body>
</html>
