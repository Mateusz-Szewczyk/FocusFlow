<!-- @dsCard group="Colors" viewport="700x160" name="Ink" subtitle="Three weights of text, pale blue-white on night" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink-1);font-family:var(--font-body);padding:20px 24px}
  .mono{font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
  
</style>
</head>
<body>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:16px"><div style="display:flex;flex-direction:column;gap:8px">
    <div style="height:52px;border-radius:8px;background:var(--ink-1);"></div>
    <div class="mono" style="color:var(--ink-2)">--ink-1 · primary</div>
    <div class="mono">#EEF1FF</div>
  </div><div style="display:flex;flex-direction:column;gap:8px">
    <div style="height:52px;border-radius:8px;background:var(--ink-2);"></div>
    <div class="mono" style="color:var(--ink-2)">--ink-2 · secondary</div>
    <div class="mono">#A7AFD8</div>
  </div><div style="display:flex;flex-direction:column;gap:8px">
    <div style="height:52px;border-radius:8px;background:var(--ink-3);"></div>
    <div class="mono" style="color:var(--ink-2)">--ink-3 · tertiary</div>
    <div class="mono">#7C84B4</div>
  </div></div>
</body>
</html>
