<!-- @dsCard group="Brand" viewport="700x220" name="Colour is honesty" subtitle="Colour is kept ÷ planned; height is volume" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink-1);font-family:var(--font-body);padding:20px 24px}
  .mono{font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  function ds(names){
    for (const k of Object.keys(window)) {
      const v = window[k];
      if (v && typeof v === 'object' && names.every(n => typeof v[n] === 'function')) return v;
    }
    return {};
  }
  const { Tree } = ds(['Tree']);
  const cases = [[2,3,'2 of 2 kept'],[4,2,'5 of 8 kept'],[5,1,'3 of 8 kept'],[-1,2,'rest, planted']];
  ReactDOM.createRoot(document.getElementById('root')).render(
    <div style={{display:'flex',alignItems:'flex-end',gap:'26px'}}>
      {cases.map(([st,g,l],i)=>(
        <div key={i} style={{flex:1,textAlign:'center'}}>
          <Tree stage={st} green={g} size={1.1} seed={i*23+9} height={130} width={110} animate={false}/>
          <div className="mono" style={{marginTop:4}}>{l}</div>
        </div>))}
    </div>
</script>
</body>
</html>
