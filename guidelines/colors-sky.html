<!-- @dsCard group="Colors" viewport="700x160" name="Sky" subtitle="The only gradient allowed in the system" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink-1);font-family:var(--font-body);padding:20px 24px}
  .mono{font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
  
</style>
</head>
<body>
<div style="display:flex;gap:16px;align-items:stretch">
    <div style="flex:2;height:96px;border-radius:12px;background:linear-gradient(var(--sky-top),var(--sky-bottom));position:relative;border:1px solid var(--hairline)">
      <div style="position:absolute;right:22px;top:20px;width:34px;height:34px;border-radius:50%;background:var(--sun-disc)"></div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px">
      <div class="mono" style="color:var(--ink-2)">--sky-top #E9EAE1</div>
      <div class="mono" style="color:var(--ink-2)">--sky-bottom #F6F5EF</div>
      <div class="mono" style="color:var(--ink-2)">--sun-disc #E1E4D8</div>
    </div>
  </div>
</body>
</html>
